<section id="hero" class="relative min-h-screen flex items-center justify-center bg-gradient-to-b from-white to-primary-100 dark:bg-none dark:bg-gray-900 text-gray-900 dark:text-white overflow-hidden pt-24">
  <div class="container mx-auto px-4 z-10">
    <div class="max-w-3xl mx-auto text-center">
      <div class="flex justify-center mb-8 animate-fade-in">
        <img src="assets/images/profile.jpg" alt="Foto de Ésley Nathan" class="w-48 h-48 md:w-56 md:h-56 rounded-full object-cover shadow-2xl border-4 border-gray-200 dark:border-gray-700 transition-transform duration-500 hover:scale-125">
      </div>
      <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 text-center animate-slide-up text-gray-900 dark:text-white">
        {{ 'hero.greeting' | translate }}
        <span class="whitespace-nowrap">
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-purple-600">
            Ésley Nathan
          </span>
          <span class="inline-block animate-wave origin-bottom-right">👋</span>
        </span>
      </h1>
      <p class="text-xl md:text-2xl text-center text-gray-600 dark:text-gray-300 mb-8 animate-slide-up delay-300">
        {{ 'hero.title' | translate }}
      </p>
      <p class="text-xl md:text-2xl text-center text-gray-600 dark:text-gray-300 mb-8 animate-slide-up delay-300">
        {{ 'hero.description' | translate }}
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center animate-slide-up delay-500 mb-10">
        <a href="#projects" class="inline-block px-8 py-3 text-lg font-semibold text-center text-white bg-primary-600 rounded-lg shadow-lg hover:bg-primary-700 hover:scale-105 transition-all duration-300">
          {{ 'hero.viewProjects' | translate }} <i class="fas fa-arrow-down ml-2"></i>
        </a>
        <a href="assets/cv/EsleyNathanCv.pdf" target="_blank" class="inline-block px-8 py-3 text-lg font-semibold text-center text-gray-700 dark:text-white bg-transparent border border-gray-300 dark:border-gray-600 rounded-lg shadow-lg hover:bg-gray-100 dark:hover:bg-gray-800 hover:scale-105 transition-all duration-300">
          {{ 'hero.downloadCV' | translate }} <i class="fas fa-file-download ml-2"></i>
        </a>
      </div>

      <!-- Ícones Sociais -->
      <div class="flex justify-center gap-6 text-3xl text-gray-500 dark:text-gray-400 opacity-0 animate-slide-up-fade delay-700">
        <a href="https://github.com/esleynathan" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors duration-300">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/esleybarbosa/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors duration-300">
          <i class="fab fa-linkedin"></i>
        </a>
        <a href="https://wa.me/5521990238348?text=Ol%C3%A1!%20Vi%20seu%20portf%C3%B3lio%20e%20gostaria%20de%20entrar%20em%20contato." target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors duration-300">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Indicador de Scroll para baixo -->
  <div *ngIf="isAtTop" class="absolute bottom-10 right-8 md:right-10 text-gray-400 dark:text-gray-500 animate-bounce transition-opacity duration-300">
    <i class="fas fa-arrow-down text-2xl"></i>
  </div>

</section>
