<section id="skills" class="py-20 bg-gray-100 dark:bg-gray-900">
  <div class="container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center text-gray-900 dark:text-white mb-16">{{ 'skills.title' | translate }}</h2>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
      <p class="text-gray-600 dark:text-gray-400 mt-4">{{ 'skills.loading' | translate }}</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !isLoading" class="text-center py-12">
      <p class="text-red-600 dark:text-red-400 mb-4">{{ error }}</p>
      <button (click)="loadSkills()" class="btn-primary">{{ 'skills.retry' | translate }}</button>
    </div>

    <!-- Skills Grid -->
    <div *ngIf="!isLoading && !error" class="space-y-16">

      <!-- Itera sobre as categorias agrupadas -->
      <div *ngFor="let category of getGroupedSkillsKeys()" class="max-w-6xl mx-auto">
        <!-- Título da Categoria -->
        <h3 class="text-2xl font-semibold text-gray-800 dark:text-gray-200 mb-8 flex items-center">
          <i [class]="categoryIcons[category] || categoryIcons['default']" class="text-primary-600 mr-4 text-2xl"></i>
          <span class="capitalize">{{ category }}</span>
        </h3>

        <!-- Grid de Skills para a categoria atual -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
          <div
            *ngFor="let skill of groupedSkills[category]"
            class="bg-white dark:bg-gray-800 rounded-lg p-4 text-center shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-300"
          >
            <!-- Ícone da Skill -->
            <div class="mb-3 h-12 flex items-center justify-center">
              <img
                *ngIf="skill.icon"
                [src]="skill.icon"
                [alt]="skill.name + ' icon'"
                class="max-h-12 mx-auto object-contain"
                (error)="handleImageError($event)"
              />
              <div
                *ngIf="!skill.icon"
                class="w-12 h-12 mx-auto bg-gray-200 dark:bg-gray-700 rounded-full flex items-center justify-center"
              >
                <i class="fas fa-code text-primary-600 text-2xl" aria-hidden="true"></i>
              </div>
            </div>

            <!-- Nome da Skill -->
            <h4 class="font-bold text-base text-gray-900 dark:text-white mb-2 truncate" [title]="skill.name">{{ skill.name }}</h4>

            <!-- Nível de Proficiência (Texto) -->
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-1">{{ getProficiencyLabel(skill.proficiency_level) }}</p>

            <!-- Barra de Proficiência -->
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
              <div
                class="bg-gradient-to-r from-primary-500 to-purple-500 h-2.5 rounded-full"
                [style.width.%]="getProficiencyWidth(skill.proficiency_level)"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty State (se não houver skills) -->
      <div *ngIf="skills.length === 0" class="text-center py-12">
        <i class="fas fa-laptop-code text-6xl text-gray-300 dark:text-gray-600 mb-4"></i>
        <p class="text-gray-600 dark:text-gray-400">{{ 'skills.empty' | translate }}</p>
        <p class="text-sm text-gray-500 mt-2">{{ 'skills.empty_admin' | translate }}</p>
      </div>
    </div>
  </div>
</section>
