# =============================================================================
# PORTFOLIO - Produção
# =============================================================================
# Requer: Traefik rodando na rede 'traefik-public'
#
# Uso:
#   docker compose up -d --build
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-portfolio_db}
      - POSTGRES_USER=${DB_USER:-portfolio_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    restart: unless-stopped
    entrypoint: /app/entrypoint.sh
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${DB_USER:-portfolio_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-portfolio_db}
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-esleynathan.com.br,www.esleynathan.com.br,localhost}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - db
    networks:
      - portfolio-internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      # Rota principal - Django serve tudo (Angular + API + Admin)
      - "traefik.http.routers.portfolio.rule=Host(`esleynathan.com.br`) || Host(`www.esleynathan.com.br`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.services.portfolio.loadbalancer.server.port=8000"
      # Redirect www para non-www
      - "traefik.http.middlewares.portfolio-redirect-www.redirectregex.regex=^https://www\\.esleynathan\\.com\\.br/(.*)"
      - "traefik.http.middlewares.portfolio-redirect-www.redirectregex.replacement=https://esleynathan.com.br/$${1}"
      - "traefik.http.middlewares.portfolio-redirect-www.redirectregex.permanent=true"
      - "traefik.http.routers.portfolio.middlewares=portfolio-redirect-www"

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  portfolio-internal:
    driver: bridge
  traefik-public:
    external: true
