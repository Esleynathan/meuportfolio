<section id="about" class="py-20 bg-white dark:bg-gray-800">
  <div class="container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center text-gray-900 dark:text-white mb-12">{{ 'about.title' | translate }}</h2>

    <div class="max-w-5xl mx-auto">
      <!-- Layout em duas colunas: Mobile (vertical) / Desktop (horizontal) -->
      <div class="flex flex-col md:flex-row gap-10 items-start">

        <!-- Foto de Perfil -->
        <div class="flex-shrink-0 mx-auto md:mx-0 animate-slide-in-left">
          <img
            src="assets/images/profile.jpg"
            [alt]="'about.imageAlt' | translate"
            class="w-64 h-64 md:w-72 md:h-72 rounded-lg object-cover shadow-2xl border-4 border-gray-200 dark:border-gray-700 hover:scale-105 transition-transform duration-300 cursor-pointer"
          />
        </div>

        <!-- Textos -->
        <div class="flex-1">
          <p class="text-lg text-gray-700 dark:text-gray-300 mb-4 leading-relaxed">
            {{ 'about.p1' | translate }}
          </p>
          <p class="text-lg text-gray-700 dark:text-gray-300 mb-4 leading-relaxed">
            {{ 'about.p2' | translate }}
          </p>
          <p class="text-lg text-gray-700 dark:text-gray-300 mb-4 leading-relaxed">
            {{ 'about.p3' | translate }}
          </p>
          <p class="text-lg text-gray-700 dark:text-gray-300 leading-relaxed">
            {{ 'about.p4' | translate }}
          </p>
        </div>

      </div>
    </div>
  </div>
</section>
