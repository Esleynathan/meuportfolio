<section id="skills" class="py-20 bg-gray-50">
  <div class="container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center text-gray-900 mb-12">{{ 'skills.title' | translate }}</h2>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
      <p class="text-gray-600 mt-4">{{ 'skills.loading' | translate }}</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !isLoading" class="text-center py-12">
      <p class="text-red-600 mb-4">{{ error }}</p>
      <button (click)="loadSkills()" class="btn-primary">{{ 'skills.retry' | translate }}</button>
    </div>

    <!-- Skills Grid -->
    <div *ngIf="!isLoading && !error" class="max-w-6xl mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div
          *ngFor="let skill of skills"
          class="bg-white rounded-lg p-6 shadow-md hover:shadow-xl hover:scale-105 transition-all duration-300 border-l-4 border-primary-600"
        >
          <!-- Header: Icon + Name -->
          <div class="flex items-center gap-4 mb-4">
            <!-- Ícone da Skill (se existir) -->
            <div class="flex-shrink-0">
              <img
                *ngIf="skill.icon"
                [src]="skill.icon"
                [alt]="skill.name + ' icon'"
                class="w-12 h-12 object-contain"
                (error)="handleImageError($event)"
              />
              <div
                *ngIf="!skill.icon"
                class="w-12 h-12 bg-primary-100 rounded-lg flex items-center justify-center"
              >
                <i class="fas fa-code text-primary-600 text-2xl"></i>
              </div>
            </div>

            <!-- Nome e Categoria -->
            <div class="flex-1">
              <h3 class="font-bold text-lg text-gray-900">{{ skill.name }}</h3>
              <p class="text-sm text-gray-600">{{ skill.category }}</p>
            </div>
          </div>

          <!-- Descrição (se existir) -->
          <p *ngIf="skill.description" class="text-sm text-gray-700 mb-4 leading-relaxed">
            {{ skill.description }}
          </p>

          <!-- Barra de Proficiência -->
          <div class="mt-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold text-gray-600">{{ 'skills.proficiency' | translate }}</span>
              <span class="text-xs font-semibold text-primary-600">{{ skill.proficiency_level }}/5</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
              <div
                class="bg-gradient-to-r from-primary-600 to-purple-600 h-2.5 rounded-full transition-all duration-500"
                [style.width.%]="(skill.proficiency_level / 5) * 100"
              ></div>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="skills.length === 0" class="col-span-full text-center py-12">
          <i class="fas fa-laptop-code text-6xl text-gray-300 mb-4"></i>
          <p class="text-gray-600">{{ 'skills.emptyState1' | translate }}</p>
          <p class="text-sm text-gray-500 mt-2">{{ 'skills.emptyState2' | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
