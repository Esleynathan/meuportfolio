# Redireciona www para versão sem www
server {
    listen 443 ssl;
    http2 on;
    server_name www.esleynathan.com.br;

    ssl_certificate /etc/letsencrypt/live/esleynathan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esleynathan.com.br/privkey.pem;

    return 301 https://esleynathan.com.br$request_uri;
}

# Servidor HTTP (porta 80) - Serve ACME challenge e redireciona para HTTPS
server {
    listen 80;
    server_name esleynathan.com.br www.esleynathan.com.br;

    # Certbot ACME Challenge (HTTP-01 validation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionar todo o resto para HTTPS
    location / {
        return 301 https://esleynathan.com.br$request_uri;
    }
}

# Servidor HTTPS Principal (porta 443)
server {
    listen 443 ssl;
    http2 on;
    server_name esleynathan.com.br;

    # Caminhos dos certificados SSL
    ssl_certificate /etc/letsencrypt/live/esleynathan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esleynathan.com.br/privkey.pem;

    # Configurações SSL modernas (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling (melhora performance SSL)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/esleynathan.com.br/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Diretório raiz Angular
    root /usr/share/nginx/html;
    index index.html;

    # Reverse Proxy para o Django Admin
    location /x/ {
        proxy_pass http://backend:8000/x/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Reverse Proxy para API Django
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Arquivos estáticos Django Admin
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Arquivos de mídia (uploads)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA Angular (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
