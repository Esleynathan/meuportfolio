version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: portfolio-db
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - portfolio-network
    restart: unless-stopped

  # Django Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://portfolio_user:${DB_PASSWORD:-dev_password_change_in_production}@db:5432/portfolio_db
      - SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-this}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      - db
    networks:
      - portfolio-network
    restart: unless-stopped

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - portfolio-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Opcional - para produção)
  # nginx:
  #   image: nginx:alpine
  #   container_name: portfolio-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - static_volume:/usr/share/nginx/html/static
  #     - media_volume:/usr/share/nginx/html/media
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - portfolio-network
  #   restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  portfolio-network:
    driver: bridge
