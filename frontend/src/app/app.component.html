<!-- Back to Top Button -->
<button
  *ngIf="showBackToTop"
  (click)="scrollToTop()"
  class="fixed bottom-8 right-8 bg-primary-600 hover:bg-primary-700 text-white w-12 h-12 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-110 z-50 flex items-center justify-center group"
  [attr.aria-label]="'backToTop' | translate"
>
  <i class="fas fa-chevron-up text-xl group-hover:animate-bounce"></i>
</button>
