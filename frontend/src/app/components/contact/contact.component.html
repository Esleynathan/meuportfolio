<section id="contact" class="py-20 bg-gray-50">
  <div class="container mx-auto px-4">
    <h2 class="text-4xl font-bold text-center text-gray-900 mb-12">{{ 'contact.title' | translate }}</h2>
    <div class="max-w-2xl mx-auto">
      <div class="card">
        <!-- Success Message -->
        <div *ngIf="submitSuccess" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
          {{ 'contact.successMessage' | translate }}
        </div>

        <!-- Error Message -->
        <div *ngIf="submitError" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
          {{ submitError }}
        </div>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Name Field -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">{{ 'contact.name' | translate }} *</label>
            <input
              type="text"
              formControlName="name"
              [class.border-red-500]="isFieldInvalid('name')"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-600 focus:border-transparent"
            />
            <p *ngIf="isFieldInvalid('name')" class="text-red-600 text-sm mt-1">
              {{ getFieldError('name') }}
            </p>
          </div>

          <!-- Email Field -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">{{ 'contact.email' | translate }} *</label>
            <input
              type="email"
              formControlName="email"
              [class.border-red-500]="isFieldInvalid('email')"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-600 focus:border-transparent"
            />
            <p *ngIf="isFieldInvalid('email')" class="text-red-600 text-sm mt-1">
              {{ getFieldError('email') }}
            </p>
          </div>

          <!-- Subject Field -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">{{ 'contact.subject' | translate }} *</label>
            <input
              type="text"
              formControlName="subject"
              [class.border-red-500]="isFieldInvalid('subject')"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-600 focus:border-transparent"
            />
            <p *ngIf="isFieldInvalid('subject')" class="text-red-600 text-sm mt-1">
              {{ getFieldError('subject') }}
            </p>
          </div>

          <!-- Message Field -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">{{ 'contact.message' | translate }} *</label>
            <textarea
              rows="5"
              formControlName="message"
              [class.border-red-500]="isFieldInvalid('message')"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-600 focus:border-transparent"
            ></textarea>
            <p *ngIf="isFieldInvalid('message')" class="text-red-600 text-sm mt-1">
              {{ getFieldError('message') }}
            </p>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="isSubmitting"
            class="btn-primary w-full disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isSubmitting">{{ 'contact.send' | translate }}</span>
            <span *ngIf="isSubmitting">{{ 'contact.sending' | translate }}</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
