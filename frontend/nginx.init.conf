# Configuração temporária Nginx - Apenas HTTP para obtenção inicial de certificados
# Este arquivo é usado pelo init-letsencrypt.sh durante a primeira configuração

server {
    listen 80;
    server_name esleynathan.com.br www.esleynathan.com.br;

    # Certbot ACME Challenge (HTTP-01 validation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Diretório raiz Angular (temporário até certificados serem obtidos)
    root /usr/share/nginx/html;
    index index.html;

    # Reverse Proxy para API Django (temporário)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Arquivos estáticos Django Admin (temporário)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA Angular (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
