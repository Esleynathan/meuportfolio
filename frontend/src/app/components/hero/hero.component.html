<section id="hero" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-600 via-primary-700 to-purple-800 text-white relative overflow-hidden">
  <!-- Background Pattern (opcional - decorativo) -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute top-20 left-10 w-72 h-72 bg-white rounded-full mix-blend-multiply filter blur-xl animate-pulse"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl animate-pulse delay-700"></div>
  </div>

  <div class="container mx-auto px-4 text-center relative z-10">
    <!-- Foto de Perfil -->
    <div class="mb-8 animate-fade-in">
      <img
        src="assets/images/profile.jpg"
        [alt]="'about.imageAlt' | translate"
        class="w-48 h-48 md:w-56 md:h-56 rounded-full mx-auto object-cover border-4 border-white shadow-2xl hover:scale-110 transition-transform duration-300 cursor-pointer"
      />
    </div>

    <!-- Título Principal -->
    <h1 class="text-5xl md:text-6xl font-extrabold mb-4 animate-slide-up">
      {{ 'hero.greeting' | translate }} <span class="text-yellow-300">Ésley Nathan</span> 👋
    </h1>

    <!-- Subtítulo -->
    <h2 class="text-2xl md:text-3xl font-semibold mb-6 text-primary-100">
      {{ 'hero.title' | translate }}
    </h2>

    <!-- Descrição -->
    <p class="text-lg md:text-xl max-w-2xl mx-auto mb-10 text-primary-50 leading-relaxed">
      {{ 'hero.description1' | translate }}<br class="hidden md:block"/>
      {{ 'hero.description2' | translate }}
    </p>

    <!-- CTAs (Call-to-Actions) -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center mb-10">
      <a
        href="#projects"
        class="bg-white text-primary-700 hover:bg-gray-100 px-8 py-4 text-lg font-semibold rounded-lg shadow-xl hover:scale-105 transition-transform duration-200"
      >
        {{ 'hero.viewProjects' | translate }} ↓
      </a>
      <a
        href="assets/cv/esley-nathan-cv.pdf"
        download
        class="border-2 border-white text-white hover:bg-white hover:text-primary-700 px-8 py-4 text-lg font-semibold rounded-lg shadow-xl hover:scale-105 transition-transform duration-200"
      >
        {{ 'hero.downloadCV' | translate }} 📄
      </a>
    </div>

    <!-- Social Links -->
    <div class="flex gap-6 justify-center text-3xl">
      <a
        href="https://github.com/esleynathan"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:text-yellow-300 transition-colors duration-200"
        [attr.aria-label]="'hero.githubLabel' | translate"
      >
        <i class="fab fa-github"></i>
      </a>
      <a
        href="https://linkedin.com/in/esleynathan"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:text-yellow-300 transition-colors duration-200"
        [attr.aria-label]="'hero.linkedinLabel' | translate"
      >
        <i class="fab fa-linkedin"></i>
      </a>
      <a
        href="mailto:seu-email@example.com"
        class="hover:text-yellow-300 transition-colors duration-200"
        [attr.aria-label]="'hero.emailLabel' | translate"
      >
        <i class="fas fa-envelope"></i>
      </a>
    </div>
  </div>

  <!-- Scroll Indicator (seta animada) -->
  <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
    <i class="fas fa-chevron-down text-3xl text-white opacity-70"></i>
  </div>
</section>
