services:
  db:
    image: postgres:15-alpine
    container_name: portfolio-db
    environment:
      - POSTGRES_DB=${DB_NAME:-portfolio_db}
      - POSTGRES_USER=${DB_USER:-portfolio_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    # O entrypoint executa as migrações e depois o comando passado
    entrypoint: /app/entrypoint.sh
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${DB_USER:-portfolio_user}:${DB_PASSWORD:-dev_password}@db:5432/${DB_NAME:-portfolio_db}
      - SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-key-change-this}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-esleynathan.com.br,www.esleynathan.com.br,localhost,backend}
    volumes:
      - static_data:/app/staticfiles # Volume para os arquivos estáticos do Django
    depends_on:
      - db
    networks:
      - portfolio-network
    restart: unless-stopped
 
  nginx:
    # A imagem do Nginx será construída a partir do nosso Dockerfile do frontend,
    # que já contém a configuração e os arquivos estáticos.
    build:
      context: ./frontend # O contexto é a pasta do frontend
      dockerfile: Dockerfile # O Dockerfile multi-stage que cria o Nginx
    container_name: portfolio-nginx
    ports:
      - "80:80"
      - "443:443" # Para HTTPS no futuro
    volumes:
      - static_data:/app/staticfiles # Nginx acessa os arquivos estáticos do Django
    depends_on:
      - backend
    networks:
      - portfolio-network
    profiles: ["prod"]
    restart: unless-stopped

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: portfolio-frontend-dev
    command: npm start -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    networks:
      - portfolio-network
    profiles: ["dev"]

volumes:
  postgres_data:
  static_data: # Volume para compartilhar os arquivos estáticos
  frontend_node_modules:

networks:
  portfolio-network:
    driver: bridge
